name: Sandbox smoke test
# Runs the MCP server against the real Fiatsend sandbox (no real money).
# Start it from the Actions tab → "Sandbox smoke test" → Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # every Monday, catches API changes
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node test/sandbox.smoke.mjs
        env:
          # Your own sandbox key if you add one as a secret; otherwise the public demo key from developer.fiatsend.com
          FIATSEND_API_KEY: ${{ secrets.FIATSEND_SANDBOX_KEY || 'fs_test_demo_key_2026' }}
